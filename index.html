<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#15110f">
<!-- 予約ボードは、お店用のアプリの引っ越し（2026-11-05 ko-dai さんの判断。計画書 バグる/お店用アプリの引っ越し.md）で
     https://t3dining-store.github.io/baguru-yoyaku/ へ移った。前のアドレス（https://t3dining.github.io/baguru-yoyaku/）を開いたら、ここが出る。
     ・この場所に残ったお店の保存（合言葉・今日の予約の控えなど）を消す。★お客さまの保存（bg. で始まるもの）は消さない
     ・新しいアドレスでは、合言葉を入れ直し、ホーム画面のアイコンも入れ直してもらう（保存の場所が別になるため）
     ・★この場所の config.js・api.js は、公式アプリが読むので、ずっと置く（道具/公開する.py の OLD_KEEP）
     公開の道具（道具/公開する.py）が、引っ越しの日（MOVED = True）から、前の場所の index.html として出す -->
<title>予約ボードは引っ越しました｜バグる</title>
<style>
  :root { --bg: #15110f; --card: #211b18; --text: #f6efe8; --muted: #c9bdb2; --ember: #e0301e; }
  * { box-sizing: border-box; }
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 24px 16px; background: var(--bg); color: var(--text);
    font-family: "Hiragino Sans", "Hiragino Kaku Gothic ProN", "Noto Sans JP", Meiryo, sans-serif; line-height: 1.7; }
  main { width: 100%; max-width: 560px; background: var(--card); border-radius: 14px; padding: 28px 24px; }
  h1 { margin: 0 0 12px; font-size: 24px; }
  p { margin: 0 0 12px; color: var(--muted); font-size: 16px; }
  ol { margin: 0 0 20px; padding-left: 1.4em; font-size: 16px; }
  li { margin-bottom: 6px; }
  a.go { display: block; text-align: center; background: var(--ember); color: #fff; text-decoration: none; font-weight: 700; font-size: 18px;
    padding: 14px 16px; border-radius: 10px; }
  small { display: block; margin-top: 14px; color: var(--muted); font-size: 13px; word-break: break-all; }
</style>
</head>
<body>
<main>
  <h1>予約ボードは引っ越しました</h1>
  <p>新しいアドレスで開き直してください。</p>
  <ol>
    <li>下の「新しい予約ボードを開く」を押します</li>
    <li>お店の合言葉を、もう一度入れます</li>
    <li>ホーム画面のアイコンを入れ直します（この古いアイコンは消してください）</li>
  </ol>
  <a class="go" id="go" href="https://t3dining-store.github.io/baguru-yoyaku/">新しい予約ボードを開く</a>
  <small>新しいアドレス：https://t3dining-store.github.io/baguru-yoyaku/</small>
</main>
<script>
  (function () {
    'use strict';
    var NEW = 'https://t3dining-store.github.io/baguru-yoyaku/';
    // この場所に残った、お店の保存を消す。計画書 バグる/お店用アプリの引っ越し.md の「古い場所で消すもの」の表の名前を全部
    //（どのアプリの「引っ越しました」でも同じ。localStorage と sessionStorage の両方から、名前で1つずつ。社員のスマホは古いアイコンしか開かないことがあるため）
    // ★bg. で始まる名前は公式アプリ（お客さまの会員・スタンプ）も使うので、この表の名前だけを消す。まとめて消さない
    // ★bg.owner は公式アプリの 🏠 も読む。このページを出すのは引っ越しの日（公式アプリの 🏠 を直したあと）
    var NAMES = ['baguru.daicho.pin', 'baguru.line.screen', 'bg.hpAdmin', 'bg.hub', 'bg.owner', 'baguru.yoyaku.owner', 'baguru.yoyaku.view',
      'baguru.daicho.seen', 'baguru.daicho.sound', 'baguru.daicho.shell', 'bg.cookRung'];
    NAMES.forEach(function (k) {
      try { localStorage.removeItem(k); } catch (e) {}
      try { sessionStorage.removeItem(k); } catch (e) {}
    });
    // Owner・Staff から来たときの印（?from=owner&hub=staff など）は、そのまま新しいアドレスへ渡す
    var go = document.getElementById('go');
    if (go && /^\?[\w=&%.-]*$/.test(location.search)) go.href = NEW + location.search;
  })();
</script>
</body>
</html>
